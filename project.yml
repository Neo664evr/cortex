name: Cortex
options:
  bundleIdPrefix: com.neo664evr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Cortex
        CFBundleName: Cortex
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "3"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: Attach photos so the on-device model can see them.
        NSCameraUsageDescription: Take a photo for the on-device model.
        NSMicrophoneUsageDescription: Dictate messages with on-device speech recognition.
        NSSpeechRecognitionUsageDescription: Transcribe your voice into the composer on device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neo664evr.gguf
            UTTypeDescription: GGUF model
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gguf
        CFBundleDocumentTypes:
          - CFBundleTypeName: GGUF model
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.neo664evr.gguf
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neo664evr.cortex
        PRODUCT_NAME: Cortex
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "2.1"
        OTHER_LDFLAGS: "-lc++"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/llama.xcframework/ios-arm64/llama.framework/Headers"
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: false
        link: true
