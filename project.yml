name: Cortex
options:
  bundleIdPrefix: com.neo664evr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neo664evr.cortex
        PRODUCT_NAME: Cortex
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Cortex
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos so the on-device model can see them."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo for the on-device model."
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CORTEX"
        OTHER_LDFLAGS: "-lc++"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/llama.xcframework/ios-arm64/llama.framework/Headers"
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: false
        codeSign: false
        link: true
